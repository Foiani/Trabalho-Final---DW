<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Portfólio de Gabriel Gonçalves</title>
  <meta name="description" content="Entre em contato com Gabriel Gonçalves.">
  <link rel="icon" href="img/perfil.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="container">
      <a class="marca" href="index.html">Gabriel Gonçalves</a>
      <nav class="menu" aria-label="Principal">
        <ul>
          <li><a href="index.html" >Início</a></li>
          <li><a href="sobre.html" >Sobre</a></li>
          <li><a href="projetos.html" >Projetos</a></li>
          <li><a href="contato.html" aria-current="page" >Contato</a></li>
        </ul>
      </nav>
      <button id="botao-tema" class="botao-tema" type="button" aria-pressed="false">Modo escuro</button>
    </div>
  </header>
  <main id="conteudo">
    <section class="container" aria-labelledby="titulo-contato">
      <h1 id="titulo-contato">Contato</h1>
      <p class="lead">Mande uma mensagem. Os campos são validados antes do envio.</p>

      <form id="formulario-contato" novalidate>
        <label for="nome">
          Nome
          <input id="nome" name="nome" type="text" required minlength="3" maxlength="60" autocomplete="name" placeholder="Seu nome">
        </label>

        <label for="email">
          E-mail
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="nome@exemplo.com">
        </label>

        <label for="assunto">
          Assunto
          <input id="assunto" name="assunto" type="text" pattern="[A-Za-zÀ-ÿ ]{3,40}" placeholder="Qual o assunto?" required>
          <span class="ajuda">Somente letras e espaços, de 3 a 40 caracteres.</span>
        </label>

        <label for="mensagem">
          Mensagem
          <textarea id="mensagem" name="mensagem" rows="5" required minlength="10" placeholder="Escreva aqui"></textarea>
        </label>

        <p id="erro" class="erro" role="alert"></p>
        <p id="sucesso" class="sucesso" role="status"></p>

        <button class="enviar" type="submit">Enviar mensagem</button>
      </form>
    </section>
  </main>
  <footer class="rodape">
    <div class="container">
      <p>© <span id="ano"></span> Gabriel Henrique Foiani Gonçalves. Feito com HTML, CSS e JavaScript.</p>
      <ul>
        <li><a href="https://www.linkedin.com/in/SEU-USUARIO">LinkedIn</a></li>
        <li><a href="https://github.com/SEU-USUARIO">GitHub</a></li>
        <li><a href="mailto:gabrielfoiani13@gmail.com">Gmail</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
